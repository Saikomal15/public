<style>
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --melon: #760800a6;
        --melon-light: #F4A49E;
        --melon-dark: #C0504A;
        --dark: #1A1010;
        --cream: #FDF0EE;
    }

    body {
        background: var(--cream);
        font-family: 'DM Sans', sans-serif;
    }

    header {
        background: var(--dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 3rem;
        height: 72px;
        position: relative;
        overflow: hidden;
    }

    /* Melon accent strip */
    header::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--melon-dark), var(--melon), var(--melon-light), var(--melon));
    }

    /* Subtle glow behind the logo */
    header::after {
        content: '';
        position: absolute;
        left: -40px;
        top: 50%;
        transform: translateY(-50%);
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(232, 115, 106, 0.15) 0%, transparent 70%);
        pointer-events: none;
    }

    h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 2rem;
        letter-spacing: 0.12em;
        color: var(--melon);
        position: relative;
        z-index: 1;
        transition: color 0.2s;
    }

    h1:hover {
        color: var(--melon-light);
    }

    nav {
        display: flex;
        align-items: center;
        gap: 2.5rem;
        position: relative;
        z-index: 1;
    }

    nav a {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        position: relative;
        padding-bottom: 2px;
        transition: color 0.2s;
    }

    nav a::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1.5px;
        background: var(--melon);
        transition: width 0.25s ease;
    }

    nav a:hover {
        color: var(--melon-light);
    }

    nav a:hover::after {
        width: 100%;
    }

    /* Demo nav labels */
    nav a:nth-child(1)::before {
        content: 'Shop';
    }

    nav a:nth-child(2)::before {
        content: 'New Drops';
    }

    nav a:nth-child(3)::before {
        content: 'Brands';
    }

    nav a:nth-child(4)::before {
        content: 'About';
    }
</style>
</head>

<body>

    <header>
        <h1>SSK Kicks</h1>
        <nav>
            <a href=""></a>
            <a href=""></a>
            <a href=""></a>
            <a href=""></a>
        </nav>
    </header>

</body>

</html>
